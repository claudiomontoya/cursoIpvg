<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda IPVG · TS + Fastify</title>
<style>
  :root {
    --azul: #1a2a4a; --azul-osc: #0F1A2E; --azul-med: #4A6FA5;
    --amarillo: #E8B84A; --amarillo-s: #F4D382;
    --verde: #7CD9A8; --rojo: #E8747C;
    --blanco: #FFFFFF; --txt: rgba(255,255,255,0.92);
    --txt-tenue: rgba(255,255,255,0.65);
    --linea: rgba(255,255,255,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, "Segoe UI", "Inter", sans-serif;
    background: linear-gradient(160deg, #1e3154 0%, #0F1A2E 100%);
    color: var(--txt); min-height: 100vh; line-height: 1.5;
  }

  .layout { display: grid; grid-template-columns: 1fr 380px; gap: 24px; max-width: 1400px; margin: 0 auto; padding: 28px 24px 60px; }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

  header {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding-bottom: 16px; border-bottom: 1px solid var(--linea);
  }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--txt-tenue); }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--amarillo); }
  .badge-mode {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--azul); background: var(--amarillo); padding: 4px 12px;
    border-radius: 3px; font-weight: 700;
  }

  h1 { font-size: clamp(26px, 3vw, 36px); font-weight: 200; letter-spacing: -0.01em; margin-bottom: 4px; }
  h1 .accent { color: var(--amarillo); font-weight: 400; }
  .subtitle { color: var(--txt-tenue); font-size: 14px; margin-bottom: 20px; }

  /* ---- Búsqueda + filtros ---- */
  .controls { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .search {
    flex: 1; min-width: 240px;
    background: rgba(0,0,0,0.32); border: 1px solid var(--linea); border-radius: 8px;
    padding: 11px 14px; color: var(--blanco); font-size: 14px; outline: none;
  }
  .search:focus { border-color: var(--amarillo); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters .chip {
    background: rgba(255,255,255,0.04); border: 1px solid var(--linea);
    color: var(--txt-tenue); padding: 6px 12px; border-radius: 20px;
    font-size: 12px; cursor: pointer; transition: all 0.15s;
    text-transform: capitalize;
  }
  .filters .chip:hover { background: rgba(232,184,74,0.12); border-color: var(--amarillo); color: var(--blanco); }
  .filters .chip.active { background: var(--amarillo); color: var(--azul); border-color: var(--amarillo); font-weight: 600; }

  /* ---- Grid productos ---- */
  .productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .producto {
    background: rgba(0,0,0,0.22); border-radius: 10px; padding: 14px 16px;
    border-top: 2px solid var(--amarillo); display: flex; flex-direction: column; gap: 6px;
    transition: transform 0.1s;
  }
  .producto:hover { transform: translateY(-2px); }
  .producto .cat {
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--txt-tenue);
  }
  .producto .nombre { font-size: 14.5px; color: var(--blanco); font-weight: 500; line-height: 1.35; min-height: 38px; }
  .producto .desc { font-size: 12px; color: var(--txt-tenue); line-height: 1.45; flex: 1; }
  .producto .precio { color: var(--amarillo); font-size: 18px; font-weight: 600; margin-top: 4px; }
  .producto .stock { font-size: 11px; color: var(--txt-tenue); }
  .producto button {
    background: var(--amarillo); color: var(--azul); border: none;
    padding: 8px; border-radius: 6px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.06em; cursor: pointer; text-transform: uppercase;
    transition: background 0.15s; margin-top: 6px;
  }
  .producto button:hover { background: var(--amarillo-s); }
  .producto button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---- Sidebar carrito ---- */
  aside {
    background: rgba(0,0,0,0.20); border-radius: 12px; padding: 20px;
    height: fit-content; position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow-y: auto;
  }
  aside h3 { font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--amarillo); margin-bottom: 16px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
  aside h3 .count { background: var(--amarillo); color: var(--azul); padding: 2px 8px; border-radius: 3px; font-size: 11px; letter-spacing: 0.05em; }

  .item-cart {
    background: rgba(0,0,0,0.20); border-radius: 8px; padding: 10px 12px;
    margin-bottom: 8px; font-size: 13px;
  }
  .item-cart .top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .item-cart .nombre { font-weight: 500; line-height: 1.3; flex: 1; }
  .item-cart .quitar { background: transparent; color: var(--rojo); border: none; cursor: pointer; font-size: 16px; padding: 0; }
  .item-cart .bot { display: flex; justify-content: space-between; align-items: center; }
  .item-cart .qty { display: flex; gap: 6px; align-items: center; }
  .item-cart .qty button {
    background: rgba(255,255,255,0.06); border: 1px solid var(--linea); color: var(--blanco);
    width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-size: 12px;
  }
  .item-cart .qty button:hover { background: rgba(232,184,74,0.18); }
  .item-cart .qty span { color: var(--amarillo); font-weight: 600; min-width: 18px; text-align: center; }
  .item-cart .subt { color: var(--amarillo); font-weight: 600; }

  .empty-cart { color: var(--txt-tenue); font-style: italic; font-size: 13px; text-align: center; padding: 24px 0; }

  .total-box {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--linea);
    display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 14px;
  }
  .total-box .num { color: var(--amarillo); font-weight: 700; font-size: 22px; }

  .acciones { display: flex; flex-direction: column; gap: 8px; }
  .acciones button {
    border: none; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 700;
    letter-spacing: 0.08em; cursor: pointer; text-transform: uppercase;
  }
  .acciones .vaciar { background: rgba(255,255,255,0.06); color: var(--txt); border: 1px solid var(--linea); }
  .acciones .vaciar:hover { background: rgba(232,116,124,0.12); border-color: var(--rojo); color: var(--rojo); }
  .acciones .finalizar { background: var(--verde); color: var(--azul); }
  .acciones .finalizar:hover { background: #99e7c3; }
  .acciones button:disabled { opacity: 0.4; cursor: not-allowed; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--verde); color: var(--azul); padding: 14px 24px; border-radius: 8px;
    font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-8px); }
  .toast.error { background: var(--rojo); color: var(--blanco); }
</style>
</head>
<body>
  <div class="layout">

    <header>
      <div class="brand"><span class="dot"></span><span>Tienda IPVG · Node + TypeScript + Fastify</span></div>
      <span class="badge-mode" style="background:#7CD9A8; color:#0F1A2E;">TS · Fastify · :8041</span>
    </header>

    <main>
      <h1>Catálogo <span class="accent">IPVG</span></h1>
      <p class="subtitle">Buscá productos, ajustá tu carrito y finalizá la compra.</p>

      <div class="controls">
        <input class="search" id="search" placeholder="Buscar productos…" autofocus>
        <div class="filters" id="filters">
          <span class="chip active" data-cat="">todos</span>
          <span class="chip" data-cat="libros">libros</span>
          <span class="chip" data-cat="utiles">útiles</span>
          <span class="chip" data-cat="cafeteria">cafetería</span>
          <span class="chip" data-cat="merch">merch</span>
        </div>
      </div>

      <div class="productos" id="productos"></div>
    </main>

    <aside>
      <h3>🛒 Tu carrito <span class="count" id="count">0</span></h3>
      <div id="items"></div>
      <div class="total-box">
        <span>Total</span>
        <span class="num" id="total">$0</span>
      </div>
      <div class="acciones">
        <button class="vaciar" id="btnVaciar">Vaciar carrito</button>
        <button class="finalizar" id="btnFinalizar">Finalizar compra</button>
      </div>
    </aside>

  </div>

  <div class="toast" id="toast"></div>

<script>
  const $ = id => document.getElementById(id);
  const fmt = n => "$" + n.toLocaleString("es-CL");

  let categoriaActiva = "";
  let query = "";

  async function fetchJSON(url, opts={}) {
    const r = await fetch(url, { headers: { "Content-Type": "application/json" }, ...opts });
    if (!r.ok) {
      const e = await r.json().catch(() => ({detail: r.statusText}));
      throw new Error(e.detail || `HTTP ${r.status}`);
    }
    return r.json();
  }

  function toast(msg, isError=false) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.toggle("error", isError);
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  }

  async function cargarProductos() {
    const params = new URLSearchParams();
    if (query) params.set("q", query);
    if (categoriaActiva) params.set("categoria", categoriaActiva);
    const data = await fetchJSON(`/api/productos?${params}`);
    renderProductos(data.items);
  }

  function renderProductos(items) {
    const cont = $("productos");
    if (!items.length) {
      cont.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color: var(--txt-tenue); padding: 40px; font-style: italic;">Sin resultados…</div>';
      return;
    }
    cont.innerHTML = "";
    items.forEach(p => {
      const div = document.createElement("div");
      div.className = "producto";
      div.innerHTML = `
        <div class="cat">${p.categoria}</div>
        <div class="nombre">${p.nombre}</div>
        <div class="desc">${p.descripcion || ""}</div>
        <div class="precio">${fmt(p.precio)}</div>
        <div class="stock">stock: ${p.stock}</div>
        <button data-id="${p._id}" ${p.stock <= 0 ? "disabled" : ""}>+ agregar</button>
      `;
      div.querySelector("button").addEventListener("click", () => agregar(p._id));
      cont.appendChild(div);
    });
  }

  async function cargarCarrito() {
    const c = await fetchJSON("/api/carrito");
    renderCarrito(c);
  }

  function renderCarrito(c) {
    const cont = $("items");
    $("count").textContent = c.items.reduce((s, it) => s + it.cantidad, 0);
    $("total").textContent = fmt(c.total);

    const vacio = c.items.length === 0;
    $("btnVaciar").disabled = vacio;
    $("btnFinalizar").disabled = vacio;

    if (vacio) {
      cont.innerHTML = '<div class="empty-cart">El carrito está vacío.<br>Agregá productos del catálogo.</div>';
      return;
    }

    cont.innerHTML = "";
    c.items.forEach(it => {
      const div = document.createElement("div");
      div.className = "item-cart";
      div.innerHTML = `
        <div class="top">
          <div class="nombre">${it.nombre}</div>
          <button class="quitar" data-id="${it.producto_id}" title="quitar">×</button>
        </div>
        <div class="bot">
          <div class="qty">
            <button class="menos" data-id="${it.producto_id}">−</button>
            <span>${it.cantidad}</span>
            <button class="mas" data-id="${it.producto_id}">+</button>
          </div>
          <div class="subt">${fmt(it.subtotal)}</div>
        </div>
      `;
      div.querySelector(".quitar").addEventListener("click", () => quitar(it.producto_id));
      div.querySelector(".menos").addEventListener("click", () => actualizar(it.producto_id, it.cantidad - 1));
      div.querySelector(".mas").addEventListener("click", () => actualizar(it.producto_id, it.cantidad + 1));
      cont.appendChild(div);
    });
  }

  async function agregar(producto_id) {
    try {
      const c = await fetchJSON("/api/carrito/agregar", {
        method: "POST",
        body: JSON.stringify({ producto_id, cantidad: 1 }),
      });
      renderCarrito(c);
      toast("Agregado al carrito");
    } catch (e) { toast(e.message, true); }
  }

  async function actualizar(producto_id, cantidad) {
    try {
      const c = await fetchJSON("/api/carrito/actualizar", {
        method: "POST",
        body: JSON.stringify({ producto_id, cantidad }),
      });
      renderCarrito(c);
    } catch (e) { toast(e.message, true); }
  }

  async function quitar(producto_id) {
    const c = await fetchJSON("/api/carrito/quitar", {
      method: "POST",
      body: JSON.stringify({ producto_id }),
    });
    renderCarrito(c);
    toast("Eliminado");
  }

  $("btnVaciar").addEventListener("click", async () => {
    if (!confirm("¿Vaciar todo el carrito?")) return;
    const c = await fetchJSON("/api/carrito/vaciar", { method: "POST" });
    renderCarrito(c);
    toast("Carrito vaciado");
  });

  $("btnFinalizar").addEventListener("click", async () => {
    try {
      const orden = await fetchJSON("/api/carrito/finalizar", { method: "POST" });
      toast(`Orden ${orden.orden_id.slice(-6)} confirmada — total ${fmt(orden.total)}`);
      cargarCarrito();
    } catch (e) { toast(e.message, true); }
  });

  let debounceTimer;
  $("search").addEventListener("input", e => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      query = e.target.value.trim();
      cargarProductos();
    }, 250);
  });

  $("filters").querySelectorAll(".chip").forEach(c => {
    c.addEventListener("click", () => {
      $("filters").querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
      c.classList.add("active");
      categoriaActiva = c.dataset.cat;
      cargarProductos();
    });
  });

  cargarProductos();
  cargarCarrito();
</script>
</body>
</html>
